[project]
name = "urban-arrow-api"
version = "0.1.0"
description = "Async Python client for the Urban Arrow (Pon Connected) bike cloud API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Koen Hendriks" }]
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.9"]
keywords = ["urban arrow", "e-bike", "cargo bike", "home assistant", "pon"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/koenhendriks/urban-arrow-api"
Issues = "https://github.com/koenhendriks/urban-arrow-api/issues"
Changelog = "https://github.com/koenhendriks/urban-arrow-api/releases"

[project.scripts]
urban-arrow = "urban_arrow_api.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.15"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/urban_arrow_api"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "SIM", "RUF"]
