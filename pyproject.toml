[project]
name = "urban-arrow-api"
version = "0.1.0"
description = "Async Python client for the Urban Arrow / Pon Connected bike cloud API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.9"]

[project.scripts]
urban-arrow = "urban_arrow_api.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/urban_arrow_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
